name: Build technical SEO assets

on:
  push:
    branches:
      - agent/technical-seo-image-schema
    paths:
      - .github/workflows/technical-seo-build.yml
      - scripts/apply-technical-seo.py
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/technical-seo-build.yml
      - scripts/apply-technical-seo.py

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out the SEO branch
        uses: actions/checkout@v4
        with:
          ref: agent/technical-seo-image-schema
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install image tooling
        run: npm install --prefix /tmp/tornado-seo sharp@0.34.3

      - name: Generate AVIF and WebP hero images
        env:
          NODE_PATH: /tmp/tornado-seo/node_modules
        run: |
          node <<'NODE'
          const sharp = require('sharp');

          async function build() {
            const input = 'assets/josh-at-work.jpg';
            await sharp(input).rotate().webp({ quality: 82, effort: 5 }).toFile('assets/josh-at-work.webp');
            await sharp(input).rotate().avif({ quality: 55, effort: 6 }).toFile('assets/josh-at-work.avif');

            for (const output of ['assets/josh-at-work.webp', 'assets/josh-at-work.avif']) {
              const metadata = await sharp(output).metadata();
              if (metadata.width !== 1365 || metadata.height !== 2048) {
                throw new Error(`${output} has unexpected dimensions ${metadata.width}x${metadata.height}`);
              }
              console.log(`${output}: ${metadata.width}x${metadata.height}, ${metadata.format}`);
            }
          }

          build().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Apply HTML, sitemap, and schema updates
        run: python3 scripts/apply-technical-seo.py

      - name: Validate XML and JSON-LD
        run: |
          python3 <<'PY'
          import json
          import re
          import xml.etree.ElementTree as ET
          from pathlib import Path

          for filename in ('sitemap.xml', 'image-sitemap.xml'):
              ET.parse(filename)
              print(f'Validated {filename}')

          pages = [
              'index.html',
              'josh-poindexter-tattoo-artist-oklahoma-city.html',
              'cover-up-tattoos-oklahoma-city.html',
              'japanese-tattoos-oklahoma-city.html',
              'horror-tattoos-oklahoma-city.html',
              'traditional-tattoos-oklahoma-city.html',
          ]
          for filename in pages:
              html = Path(filename).read_text(encoding='utf-8')
              blocks = re.findall(r'<script type="application/ld\+json">(.*?)</script>', html, re.S)
              if len(blocks) != 1:
                  raise RuntimeError(f'{filename}: expected one JSON-LD block, found {len(blocks)}')
              data = json.loads(blocks[0])
              ids = {node.get('@id') for node in data.get('@graph', [])}
              if 'https://tornadotattoo.com/#business' not in ids:
                  raise RuntimeError(f'{filename}: missing canonical business ID')
              print(f'Validated {filename}')
          PY

      - name: Commit generated SEO assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            assets/josh-at-work.avif \
            assets/josh-at-work.webp \
            index.html \
            josh-poindexter-tattoo-artist-oklahoma-city.html \
            cover-up-tattoos-oklahoma-city.html \
            japanese-tattoos-oklahoma-city.html \
            horror-tattoos-oklahoma-city.html \
            traditional-tattoos-oklahoma-city.html \
            sitemap.xml \
            image-sitemap.xml \
            robots.txt
          git diff --cached --check
          git commit -m "Strengthen image SEO and structured data"
          git push origin HEAD:agent/technical-seo-image-schema
