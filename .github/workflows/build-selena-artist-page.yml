name: Build Selena artist page

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
    paths:
      - .github/selena-image/**
      - .github/workflows/build-selena-artist-page.yml
      - selena-gjovaag-tattoo-artist-oklahoma-city.html

permissions:
  contents: write

jobs:
  build:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out Selena artist branch
        uses: actions/checkout@v4
        with:
          ref: agent/selena-artist-page
          fetch-depth: 0

      - name: Verify transferred hero image chunks
        run: |
          echo "9b23c461960cc6a35f6a717b0854eac85e1684ba0275ea18529c5dc744daf8ca  .github/selena-image/part00.hex" | sha256sum --check
          echo "5356e62c419715d1c2e86217a01127c4a52a2716fe701917e790df41f0ff5f46  .github/selena-image/part01.hex" | sha256sum --check
          echo "aba363ff0925aef7b886935fe8a40edfe619941fb3cd3c3951554bedf1e12158  .github/selena-image/part02.hex" | sha256sum --check
          echo "426474627ad8fe9d8053aab3a3cd9d09212b6d11a410eb520ae83e63058aa42a  .github/selena-image/part03.hex" | sha256sum --check
          echo "4ae9f4b01d7bedfe43e911ed5365f8a87257b410943ffb45945b86ac9462859f  .github/selena-image/part04.hex" | sha256sum --check
          echo "aec168e3d51bf20fff01296a36fdef6ae5c1353bed66239b68ede98c6893420a  .github/selena-image/part05.hex" | sha256sum --check
          echo "49163dac5d2f16b0b9f80ee77edce396a1e3bb6628a51ef3f593a6c885198eae  .github/selena-image/part06.hex" | sha256sum --check
          echo "16c1d8fa6b55f9dd421c85c8986f222316585f09b7efd0e13e5e394e773e7e9a  .github/selena-image/part07.hex" | sha256sum --check
          echo "1fd7a9274d1935a8fbf28328f771bf05e46011c9478253290ef14bfc118e2340  .github/selena-image/part08.hex" | sha256sum --check

      - name: Restore optimized Selena hero image
        run: |
          cat .github/selena-image/part*.hex > /tmp/selena-image.hex
          echo "0ba9b402029467462c914090bba5c3046bae8e7d641d24dcd3dc57604d9fefc3  /tmp/selena-image.hex" | sha256sum --check
          python3 - <<'PY'
          from pathlib import Path
          hex_data = Path('/tmp/selena-image.hex').read_text(encoding='utf-8').strip()
          Path('assets/selena-gjovaag-at-work.webp').write_bytes(bytes.fromhex(hex_data))
          PY
          echo "4804623a1812041a2462992889f05449361e3a42e4fb3ddb1bc6fd8a1e72e8c6  assets/selena-gjovaag-at-work.webp" | sha256sum --check

      - name: Connect Selena page across the site
        run: |
          python3 - <<'PY'
          from pathlib import Path

          artist_page = Path('selena-gjovaag-tattoo-artist-oklahoma-city.html')
          page = artist_page.read_text(encoding='utf-8')
          page = page.replace('content="1400"', 'content="1200"')
          page = page.replace('content="933"', 'content="800"')
          page = page.replace('"width": 1400', '"width": 1200')
          page = page.replace('"height": 933', '"height": 800')
          page = page.replace('width="1400" height="933"', 'width="1200" height="800"')
          artist_page.write_text(page, encoding='utf-8')

          index_path = Path('index.html')
          index = index_path.read_text(encoding='utf-8')
          josh_nav = '<a href="josh-poindexter-tattoo-artist-oklahoma-city.html">Josh</a>'
          selena_nav = '<a href="selena-gjovaag-tattoo-artist-oklahoma-city.html">Selena</a>'
          if selena_nav not in index:
              index = index.replace(josh_nav, josh_nav + '\n        ' + selena_nav, 1)

          old_card = '<a href="https://www.instagram.com/seljoart/" target="_blank" rel="noopener noreferrer">View Selena’s Work <span>→</span></a>'
          new_card = '<a href="selena-gjovaag-tattoo-artist-oklahoma-city.html">View Selena’s Page <span>→</span></a>'
          index = index.replace(old_card, new_card, 1)

          josh_footer = '<a href="josh-poindexter-tattoo-artist-oklahoma-city.html">Josh Poindexter</a>'
          selena_footer = '<a href="selena-gjovaag-tattoo-artist-oklahoma-city.html">Selena Gjovaag</a>'
          if selena_footer not in index:
              index = index.replace(josh_footer, josh_footer + selena_footer, 1)
          index_path.write_text(index, encoding='utf-8')

          sitemap_path = Path('sitemap.xml')
          sitemap = sitemap_path.read_text(encoding='utf-8')
          selena_url = 'https://tornadotattoo.com/selena-gjovaag-tattoo-artist-oklahoma-city.html'
          if selena_url not in sitemap:
              entry = '''  <url>\n    <loc>https://tornadotattoo.com/selena-gjovaag-tattoo-artist-oklahoma-city.html</loc>\n    <lastmod>2026-07-29</lastmod>\n  </url>\n'''
              marker = '  <url>\n    <loc>https://tornadotattoo.com/cover-up-tattoos-oklahoma-city.html</loc>'
              sitemap = sitemap.replace(marker, entry + marker, 1)
          sitemap_path.write_text(sitemap, encoding='utf-8')

          image_sitemap_path = Path('image-sitemap.xml')
          image_sitemap = image_sitemap_path.read_text(encoding='utf-8')
          if selena_url not in image_sitemap:
              entry = '''  <url>\n    <loc>https://tornadotattoo.com/selena-gjovaag-tattoo-artist-oklahoma-city.html</loc>\n    <lastmod>2026-07-29</lastmod>\n    <image:image>\n      <image:loc>https://tornadotattoo.com/assets/selena-gjovaag-at-work.webp</image:loc>\n      <image:title>Selena Gjovaag tattooing at Tornado Tattoo</image:title>\n      <image:caption>Selena Gjovaag tattooing a client under a ring light at Tornado Tattoo in Oklahoma City.</image:caption>\n    </image:image>\n    <image:image>\n      <image:loc>https://tornadotattoo.com/assets/selena-gjovaag.jpg</image:loc>\n      <image:title>Selena Gjovaag, Oklahoma City tattoo artist</image:title>\n      <image:caption>Portrait of Selena Gjovaag, artist at Tornado Tattoo.</image:caption>\n    </image:image>\n  </url>\n'''
              marker = '  <url>\n    <loc>https://tornadotattoo.com/cover-up-tattoos-oklahoma-city.html</loc>'
              image_sitemap = image_sitemap.replace(marker, entry + marker, 1)
          image_sitemap_path.write_text(image_sitemap, encoding='utf-8')
          PY

      - name: Validate Selena page and SEO files
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          import xml.etree.ElementTree as ET

          page_path = Path('selena-gjovaag-tattoo-artist-oklahoma-city.html')
          page = page_path.read_text(encoding='utf-8')
          assert page.count('<h1>') == 1, 'Selena page must contain exactly one H1'
          assert '<link rel="canonical" href="https://tornadotattoo.com/selena-gjovaag-tattoo-artist-oklahoma-city.html">' in page
          assert 'assets/selena-gjovaag-at-work.webp' in page
          assert 'width="1200" height="800"' in page
          assert 'Selena Gjovaag' in page and 'Selena Gjovaag' in page

          match = re.search(r'<script type="application/ld\+json">\s*(.*?)\s*</script>', page, re.S)
          assert match, 'JSON-LD block missing'
          schema = json.loads(match.group(1))
          assert schema['@context'] == 'https://schema.org'

          image = Path('assets/selena-gjovaag-at-work.webp')
          assert image.exists() and image.stat().st_size > 30000

          index = Path('index.html').read_text(encoding='utf-8')
          assert index.count('href="selena-gjovaag-tattoo-artist-oklahoma-city.html"') >= 3
          assert 'View Selena’s Page' in index

          for xml_file in ('sitemap.xml', 'image-sitemap.xml'):
              ET.parse(xml_file)
              text = Path(xml_file).read_text(encoding='utf-8')
              assert 'selena-gjovaag-tattoo-artist-oklahoma-city.html' in text
          PY

      - name: Commit production-ready Selena page
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm -r .github/selena-image
          git rm .github/workflows/build-selena-artist-page.yml
          git add -A
          git diff --cached --check
          git commit -m "Build Selena Gjovaag artist page"
          git push origin HEAD:agent/selena-artist-page
